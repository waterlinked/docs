<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="DVL-A250 rear O-ring entry, vehicle mounting interface" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="490" fill="#FFFFFF"/><text x="24" y="30" font-size="15" fill="#1F1F1F" font-weight="600">The plug locates the DVL, the FWD feature sets its rotation</text><text x="24" y="50" font-size="11.5" fill="#6B6B6B">Seen from above through the vehicle plate, forward up. Dimensions in mm.</text><line x1="260" y1="104" x2="260" y2="452" stroke="#D6D3CB" stroke-width="1" stroke-dasharray="6 4"/><line x1="90" y1="280" x2="418" y2="280" stroke="#D6D3CB" stroke-width="1" stroke-dasharray="6 4"/><circle cx="260" cy="280" r="163" fill="none" stroke="#9A968C" stroke-width="1" stroke-opacity="0.5"/><line x1="158" y1="460" x2="178" y2="422" stroke="#D6D3CB" stroke-width="1"/><text x="24" y="466" font-size="11.5" fill="#6B6B6B">Ø148.50 DVL footprint</text><circle cx="260" cy="280" r="150" fill="none" stroke="#9A968C" stroke-width="1" stroke-dasharray="10 4 2 4"/><line x1="146" y1="416" x2="153" y2="389" stroke="#D6D3CB" stroke-width="1"/><text x="24" y="424" font-size="11.5" fill="#6B6B6B">Ø136.50 bolt circle</text><line x1="260" y1="112" x2="260" y2="79" stroke="#9A968C" stroke-width="1.25"/><polygon points="260,72 256,80 264,80" fill="#9A968C"/><text x="270" y="84" font-size="11.5" fill="#6B6B6B">x, forward</text><path d="M194 130H252M194 388H240" fill="none" stroke="#D6D3CB" stroke-width="1"/><line x1="200" y1="138" x2="200" y2="380" stroke="#9A968C" stroke-width="1"/><polygon points="200,131 196.5,138 203.5,138" fill="#9A968C"/><polygon points="200,387 196.5,380 203.5,380" fill="#9A968C"/><text x="194" y="262" font-size="11.5" fill="#1F1F1F" text-anchor="end">117.25</text><rect x="251" y="118" width="18" height="24" rx="9" fill="none" stroke="#9A968C" stroke-width="1.25" stroke-dasharray="3 2"/><circle cx="260" cy="130" r="5" fill="#2F6FD6" fill-opacity="0.35" stroke="#2F6FD6" stroke-width="2"/><line x1="269" y1="130" x2="470" y2="130" stroke="#D6D3CB" stroke-width="1"/><text x="478" y="134" font-size="13" fill="#1F1F1F" font-weight="600">FWD feature, sets rotation</text><text x="478" y="152" font-size="11.5" fill="#1F1F1F">Locating pin for precision mounting</text><text x="478" y="168" font-size="11.5" fill="#1F1F1F">or M5 thread for standard mounting</text><text x="478" y="184" font-size="11.5" fill="#6B6B6B">Dashed outline is the DVL slot</text><circle cx="110" cy="280" r="6" fill="none" stroke="#9A968C" stroke-width="1.25"/><circle cx="410" cy="280" r="6" fill="none" stroke="#9A968C" stroke-width="1.25"/><circle cx="260" cy="430" r="6" fill="none" stroke="#9A968C" stroke-width="1.25"/><line x1="418" y1="280" x2="470" y2="280" stroke="#D6D3CB" stroke-width="1"/><text x="478" y="284" font-size="13" fill="#1F1F1F" font-weight="600">3 × M5x0.8-6H, clamp only</text><text x="478" y="302" font-size="11.5" fill="#1F1F1F">Aft hole and both side holes</text><circle cx="260" cy="388" r="18" fill="#2F6FD6" fill-opacity="0.12" stroke="#2F6FD6" stroke-width="2"/><circle cx="260" cy="388" r="9" fill="none" stroke="#9A968C" stroke-width="1"/><line x1="280" y1="388" x2="470" y2="388" stroke="#D6D3CB" stroke-width="1"/><text x="478" y="392" font-size="13" fill="#1F1F1F" font-weight="600">Ø16.50 H8 bore, locates the plug</text><text x="478" y="410" font-size="11.5" fill="#1F1F1F">At least 12.80 mm deep</text><text x="478" y="426" font-size="11.5" fill="#1F1F1F">Ø17.30 × 40° countersink at the face</text><text x="478" y="442" font-size="11.5" fill="#1F1F1F">Cable passage into the vehicle</text></svg>