name: Build Docs

on:
  push:
    branches:
      - '**'   # run on all branches

# A new push to a branch stops the older run of that branch. Runs on master are never stopped,
# they wait in line, so a deploy is not cut off halfway and two deploys cannot run at the same time.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # full history: the PDF covers use the date of the last change per product

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Install dependencies
      run: uv sync --locked

    # Always build docs, e.g. for testing
    - name: Build docs
      run: |
        uv run mkdocs build --strict
        uv run python check-images.py site
        ./check-links.sh

    # One PDF manual per product, generated from the site that was just built, so the PDFs
    # always contain the same pages and content as the website. The script fails the build if
    # a page from the nav is missing in a PDF, or on broken internal links / missing images.
    - name: Install Chromium for PDF generation
      run: uv run playwright install --with-deps chromium

    - name: Build and verify PDF manuals
      run: uv run python scripts/build_pdf.py --site-dir site --out-dir docs/pdf

    # Makes the PDFs of every branch downloadable from the workflow run, for review before merging.
    - name: Upload PDF manuals
      if: always()   # also when verification fails, so the problem can be inspected
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pdf-manuals
        path: docs/pdf/*.pdf
        if-no-files-found: ignore
        retention-days: 30

    # The site that gets published. It is built here, with the locked dependencies, after the PDFs
    # exist in docs/pdf/, so it contains them under /pdf/ where the "Download PDF" buttons link to.
    - name: Build the site to publish
      run: |
        uv run mkdocs build --strict
        uv run python check-images.py site
        test "$(ls site/pdf/*.pdf | wc -l)" -ge 1

    # Only on master: hand the site/ directory that was built and checked above to the deploy job.
    # Nothing is rebuilt, so the published site uses the MkDocs, theme and plugin versions from
    # uv.lock.
    - name: Upload the site for GitHub Pages
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site

  # Publishes the uploaded site to GitHub Pages (https://docs.waterlinked.com). The site is not
  # stored in a branch. This needs the repository setting Settings -> Pages -> Source to be
  # "GitHub Actions". The custom domain is also set on that settings page, not in a CNAME file.
  deploy:
    name: Deploy docs
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish to GitHub Pages
      id-token: write   # to prove that the site comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
